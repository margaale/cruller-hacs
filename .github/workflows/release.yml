name: Release

# Releases are cut from master only. GitVersion computes the version (see
# GitVersion.yml); the workflow patches manifest.json with it and ships the
# integration as a zip asset, so the version is never edited by hand.
on:
  push:
    branches: [master]

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0  # GitVersion needs the full history

      - name: Install GitVersion
        uses: gittools/actions/gitversion/setup@v4
        with:
          versionSpec: '6.x'
      - name: Determine version
        id: gitversion
        uses: gittools/actions/gitversion/execute@v4

      # HACS installs from this zip (hacs.json: zip_release), so the version
      # written into the bundled manifest is what users get — no manual bump.
      - name: Package integration with the computed version
        env:
          VERSION: ${{ steps.gitversion.outputs.majorMinorPatch }}
        run: |
          python - <<'PY'
          import json, os
          p = "custom_components/cruller/manifest.json"
          m = json.load(open(p))
          m["version"] = os.environ["VERSION"]
          json.dump(m, open(p, "w"), indent=2)
          PY
          cd custom_components/cruller
          zip -r "$GITHUB_WORKSPACE/cruller.zip" .

      - name: Publish release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: v${{ steps.gitversion.outputs.majorMinorPatch }}
          name: v${{ steps.gitversion.outputs.majorMinorPatch }}
          generate_release_notes: true
          files: cruller.zip
