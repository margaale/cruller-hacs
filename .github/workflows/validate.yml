name: Validate

on:
  push:
  pull_request:
  schedule:
    - cron: "0 6 * * 1"  # weekly, so HA/HACS changes surface even without pushes
  workflow_dispatch:

jobs:
  hassfest:
    name: hassfest
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: home-assistant/actions/hassfest@master

  hacs:
    name: HACS
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: hacs/action@main
        with:
          category: integration
          # This is a custom integration, not (yet) in home-assistant/brands.
          ignore: brands

  # Home Assistant itself, with Cruller's API mocked as its docs/API.md describes (tests/conftest.py).
  tests:
    name: Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
      - run: pip install -r requirements_test.txt
      - run: pytest -q
